<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolopTik - Gift Goal Widget</title>
  <!-- Google Fonts Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="goal.css">
</head>
<body>
  <div class="goal-container">
    <div class="goal-header">
      <div class="goal-title" id="goal-title">Loading Goal...</div>
      <div class="goal-percentage" id="goal-percentage">0%</div>
    </div>
    <div class="goal-bar-bg">
      <div class="goal-bar-fill" id="goal-bar-fill"></div>
    </div>
    <div class="goal-footer">
      <div class="goal-current" id="goal-current">0</div>
      <div class="goal-target" id="goal-target">0 Koin</div>
    </div>
  </div>

  <script src="goal.js"></script>
</body>
</html>
